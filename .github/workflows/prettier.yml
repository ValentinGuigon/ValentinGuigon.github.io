name: Prettier code formatter

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install formatter dependencies
        run: npm ci

      - name: Check formatting
        id: prettier
        continue-on-error: true
        run: npm run format:check

      - name: Report advisory formatting result
        if: steps.prettier.outcome == 'failure'
        run: |
          echo '::warning::Prettier reported formatting issues. See the Check formatting step for details.'
          echo 'Prettier reported formatting issues. See the Check formatting step for details. Run `npm run format` locally if you want to apply formatting.' >> "$GITHUB_STEP_SUMMARY"
